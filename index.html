<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сыныптағы шу деңгейі</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="title-section">
                    <h1 class="app-title">Сыныптағы шу деңгейі</h1>
                    <p class="app-subtitle">Сыныптағы дыбыс деңгейін бақылау</p>
                </div>
                
                <div class="header-controls">
                    <button id="settings-btn" class="icon-btn" aria-label="Параметрлер">
                        <span class="icon">⚙️</span>
                        <span class="btn-text">Параметрлер</span>
                    </button>
                    
                    <button id="start-btn" class="primary-btn">
                        <span class="btn-icon">🎤</span>
                        <span class="btn-text">Микрофонды іске қосу</span>
                    </button>
                    
                    <button id="fullscreen-btn" class="icon-btn" aria-label="Толық экран">
                        <span class="icon">⤢</span>
                        <span class="btn-text">Толық экран</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="canvas-container">
                <canvas id="visualizer-canvas"></canvas>
                
                <div class="noise-indicator">
                    <div class="noise-level">
                        <div class="noise-value-container">
                            <span class="noise-label">Шу деңгейі:</span>
                            <span class="noise-value" id="noise-value">0 дБ</span>
                        </div>
                        <div class="noise-status" id="noise-status">Тыныш</div>
                    </div>
                    
                    <div class="noise-bar-container">
                        <div class="noise-bar">
                            <div class="noise-fill" id="noise-fill"></div>
                        </div>
                        <div class="noise-scale">
                            <span>0</span>
                            <span>40</span>
                            <span>60</span>
                            <span>80</span>
                            <span>100+</span>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="stats-panel">
                <div class="panel-header">
                    <h3>Шу деңгейінің тарихы</h3>
                    <button id="reset-btn" class="small-btn">Тазалау</button>
                </div>
                
                <div class="graph-container">
                    <canvas id="history-graph"></canvas>
                </div>
                
                <div class="statistics">
                    <div class="stat-item">
                        <span class="stat-label">Ең төмен:</span>
                        <span class="stat-value" id="min-value">0 дБ</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Орташа:</span>
                        <span class="stat-value" id="avg-value">0 дБ</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Ең жоғары:</span>
                        <span class="stat-value" id="max-value">0 дБ</span>
                    </div>
                </div>
            </aside>
        </main>

        <div class="message-container" id="message-container">
            <!-- Dynamic messages will appear here -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Параметрлер</h2>
                <button class="close-modal" id="close-settings">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="setting-group">
                    <label for="ball-count">Шар саны:</label>
                    <div class="range-input">
                        <input type="range" id="ball-count" min="10" max="50" value="30">
                        <span class="setting-value" id="ball-count-value">30</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label for="sensitivity">Анимация сезімталықы:</label>
                    <div class="range-input">
                        <input type="range" id="sensitivity" min="0.5" max="2" step="0.1" value="1">
                        <span class="setting-value" id="sensitivity-value">1.0</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label for="smoothing">Шу есептеу жылдамдығы:</label>
                    <div class="range-input">
                        <input type="range" id="smoothing" min="0.1" max="0.9" step="0.1" value="0.3">
                        <span class="setting-value" id="smoothing-value">0.3</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label for="calibration">Микрофонды калибрлеу (offset):</label>
                    <input type="number" id="calibration" min="-20" max="20" value="0" step="1" class="number-input">
                    <span class="setting-note">Дыбыс деңгейінің көрсеткіші микрофонға және құрылғыға байланысты өзгеруі мүмкін.</span>
                </div>
                
                <div class="setting-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-graph" checked> 
                        График көрсету
                    </label>
                </div>
                
                <div class="setting-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="fullscreen-mode"> 
                        Толық экран режимі
                    </label>
                </div>
            </div>
            
            <div class="modal-footer">
                <button id="reset-settings" class="secondary-btn">Әдепкі параметрлер</button>
                <button id="save-settings" class="primary-btn">Сақтау</button>
                <button id="close-settings-bottom" class="secondary-btn">Жабу</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
